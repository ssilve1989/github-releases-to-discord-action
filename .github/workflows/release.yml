name: Release Bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to build and bundle (e.g. v2.0.0). Creates/updates the tag if missing."
        required: true
  release:
    types: [published]

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build bundle
        run: pnpm build

      - name: Verify bundle is self-contained ESM
        run: node --check dist/index.js

      - name: Commit dist to the release ref
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || github.event.inputs.version }}"
          if [ -n "${TAG:-}" ]; then
            git add -f dist/index.js
            git -c user.name="github-actions[bot]" \
               -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
               commit -m "build: bundle dist/index.js for ${TAG}"
            git tag -f "$TAG"
            git push origin "$TAG" --force
          fi